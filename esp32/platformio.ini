[platformio]
default_envs = esp32dev
extra_configs = secrets.ini ; the OTA password, not in git

; Upload over USB.
[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 921600

; The same firmware, uploaded over WiFi.
[env:ota]
extends = env:esp32dev
upload_protocol = espota
upload_port = smartfan.local
upload_flags = --auth=${secrets.ota_pass}